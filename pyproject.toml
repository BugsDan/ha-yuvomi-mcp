[project]
name = "yuvomi-mcp-ha-tests"
version = "1.4.4"
requires-python = ">=3.12"
dependencies = ["aiohttp==3.14.5", "jsonschema==4.26.0", "probatio==0.13.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["custom_components.yuvomi_mcp*"]

[tool.setuptools.package-data]
"custom_components.yuvomi_mcp" = ["*.json", "translations/*.json"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "aioresponses==0.7.9", "ruff==0.17.1", "tzdata==2026.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
