name: Tests

on:
  push:
    branches: [main, test/v1.4.4, test/v1.4.4-rc2, test/v1.4.4-rc3]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q -ra --junitxml=test-results.xml
      - run: ruff check custom_components tests tools
      - run: ruff format --check custom_components tests tools
      - run: python tools/check_repository.py --staged
      - run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results.xml

  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[test]' homeassistant==2026.10.2
      - run: python tools/install_ha_test_requirements.py
      - name: Require real HA runtime before platform tests
        run: python -c 'import homeassistant; from homeassistant.components import llm'
      - run: python -m pytest -q -ra --junitxml=test-results-ha.xml
      - run: python tools/check_test_report.py test-results-ha.xml --no-skips
      - run: python tools/check_ha_api.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-assistant-test-results
          path: test-results-ha.xml

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hacs/action@main
        with:
          category: integration
          comment: false

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
